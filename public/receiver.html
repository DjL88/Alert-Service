<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Store Alerts · Receiver</title>
<style>body{margin:0;background:#f5f7f6;color:#152821;font:16px system-ui,sans-serif}main{max-width:540px;margin:6vh auto;padding:24px}section{background:white;border:1px solid #dce4e0;border-radius:16px;padding:24px}h1{font-size:26px}label{display:block;margin:16px 0 6px;font-weight:600}input,select,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #aebcb5;border-radius:8px}button{margin-top:16px;background:#064334;color:white;border:0;cursor:pointer}button.secondary{background:white;color:#064334;border:1px solid #aebcb5}p{line-height:1.5;color:#52645b}#status{font-weight:600}small{color:#52645b}</style></head>
<body><main><section><h1>Audio receiver</h1><p>Play simple order sounds through this device's audio output. Keep this page open and the device awake.</p>
<label for="token">Store access token</label><input id="token" type="password" autocomplete="off" placeholder="Enter access token">
<label for="store">Store</label><select id="store"><option value="">Connect to load stores</option></select>
<label for="sound">Alert sound</label><select id="sound"><option value="two">Two-tone</option><option value="single">Single tone</option></select>
<button id="start">Connect and enable sound</button><button class="secondary" id="test">Test speaker</button><button class="secondary" id="stop" disabled>Disconnect</button>
<p id="status" role="status">Not connected</p><small>Sounds play only for new, unexpired screen alerts. No speech, uploads or voice configuration.</small></section></main>
<script>
const token=document.getElementById('token'),store=document.getElementById('store'),sound=document.getElementById('sound'),status=document.getElementById('status');
let timer=null,ctx=null,seen=new Set(),busy=false;
function note(frequency,start,length){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=frequency;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.12,start+.02);gain.gain.exponentialRampToValueAtTime(.0001,start+length);osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+length);}
async function chime(){ctx ||= new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();const now=ctx.currentTime+.03;note(740,now,.22);if(sound.value==='two')note(980,now+.24,.30);}
async function fetchState(){const response=await fetch('/api/console',{headers:{Authorization:'Bearer '+token.value.trim()},cache:'no-store'});if(!response.ok)throw new Error(response.status===401?'Invalid access token':'Service unavailable ('+response.status+')');const body=await response.json();return body.state;}
async function poll(){if(busy)return;busy=true;try{const state=await fetchState();const stores=[...new Map(state.mappings.filter(m=>m.state==='active'&&m.provider==='screen').map(m=>[m.locationId,m.name||m.locationId])).entries()];const current=store.value;store.replaceChildren(new Option('Choose a store',''),...stores.map(([id,name])=>new Option(name,id)));if(stores.some(([id])=>id===current))store.value=current;const fresh=(state.alerts||[]).filter(a=>a.provider==='screen'&&a.status==='screen_available'&&a.locationId===store.value&&Date.parse(a.expiresAt)>Date.now());const newAlerts=fresh.filter(a=>!seen.has(a.id));for(const alert of fresh)seen.add(alert.id);if(newAlerts.length)await chime();status.textContent='Connected · '+(store.value?'Listening for orders':'Choose a store')+(newAlerts.length?' · New alert':'');}catch(e){status.textContent=e.message;}finally{busy=false;}}
document.getElementById('start').onclick=async()=>{if(!token.value.trim()){status.textContent='Enter an access token';return;}try{await chime();const state=await fetchState();seen=new Set((state.alerts||[]).map(a=>a.id));if(timer)clearInterval(timer);timer=setInterval(poll,3000);document.getElementById('stop').disabled=false;status.textContent='Connected · Choose a store';await poll();}catch(e){status.textContent=e.message;}};
document.getElementById('test').onclick=()=>chime().catch(e=>status.textContent=e.message);
document.getElementById('stop').onclick=()=>{clearInterval(timer);timer=null;seen.clear();document.getElementById('stop').disabled=true;status.textContent='Disconnected';};
store.onchange=()=>{seen.clear();fetchState().then(s=>{seen=new Set((s.alerts||[]).map(a=>a.id));status.textContent='Listening for orders';}).catch(e=>status.textContent=e.message);};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&timer)void poll();});
</script></body></html>
